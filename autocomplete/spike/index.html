<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PS autocomplete: browser feasibility spike</title>
<style>
  body { font: 13px/1.4 system-ui, sans-serif; margin: 16px; max-width: 1400px; }
  table { border-collapse: collapse; margin: 8px 0; }
  th, td { border: 1px solid #bbb; padding: 3px 6px; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child, td.l { text-align: left; }
  #log { white-space: pre-wrap; font: 12px/1.3 ui-monospace, monospace; background: #f4f4f4; padding: 8px; max-height: 320px; overflow: auto; }
  .ok { color: #070; } .bad { color: #b00; }
  label { margin-right: 12px; }
</style>
</head>
<body>
<h2>Phase 1.5 browser spike (onnxruntime-web <span id="ortver"></span>)</h2>
<p id="env"></p>
<p>
  <label>sizes <input id="sizes" value="xs,s,m" size="8"></label>
  <label>variants <input id="variants" value="int8,fp32,fp16" size="14"></label>
  <label>providers <input id="eps" value="wasm,webgpu" size="12"></label>
  <label>reps <input id="reps" value="5" size="3"></label>
  <label>prompt tokens <input id="prompt" value="200" size="4"></label>
  <label>decode tokens <input id="decode" value="16" size="3"></label>
  <label>wasm threads <input id="threads" value="1" size="3"> (page reload needed to change)</label>
  <button id="run">Run all</button>
  <button id="tok">Tokenizer check</button>
</p>
<div id="tokres"></div>
<table id="results">
  <thead><tr>
    <th>size</th><th>variant</th><th>EP</th><th>file MB</th><th>fetch ms</th><th>session create ms</th>
    <th>cold first run ms</th><th>warm prompt ms</th><th>warm decode ms/tok</th><th>warm total ms</th>
    <th>mem before MB</th><th>mem after MB</th><th>nodes on CPU</th><th>CPU fallback ops</th><th>status</th>
  </tr></thead>
  <tbody></tbody>
</table>
<p><button id="copy">Copy results JSON</button> <button id="md">Copy markdown</button></p>
<div id="log"></div>
<script src="/ort/ort.webgpu.min.js"></script>
<script src="bpe_tokenizer.js"></script>
<script src="spike.js"></script>
</body>
</html>
